argo-cd:
  global:
    domain: my-platform.local

  configs:
    cm:
      url: "http://my-platform.local"
    params:
      server.insecure: "true"
      server.rootpath: "/argocd"
      server.basehref: "/argocd"

  server:
    extraArgs:
      - --insecure

    service:
      type: ClusterIP
      servicePortHttp: 80

    ingress:
      enabled: false

  repoServer:
    replicas: 1
  controller:
    replicas: 1
  redis-ha:
    enabled: false
  redis:
    enabled: true
  notifications:
    enabled: false
