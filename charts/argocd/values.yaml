argo-cd:
  global:
    domain: my-platform.local

  configs:
    cm:
      # URL має бути БЕЗ слеша в кінці
      url: "http://my-platform.local/argocd"
    params:
      server.insecure: "true"

  server:
    extraArgs:
      - --insecure
      - --rootpath
      - /argocd

    service:
      type: ClusterIP
      servicePortHttp: 80

    ingress:
      enabled: false

  repoServer:
    replicas: 1
  controller:
    replicas: 1
  redis-ha:
    enabled: false
  redis:
    enabled: true
  notifications:
    enabled: false
