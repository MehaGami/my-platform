argo-cd:
  global:
    domain: my-platform.local

  configs:
    cm:
      # URL має бути БЕЗ слеша в кінці
      url: "http://my-platform.local/argocd"
      params:
        server.insecure: "true"
      # rootpath каже серверу ігнорувати цей префікс при маршрутизації
      server.rootpath: "/argocd"
      # basehref каже браузеру, звідки починати шляхи (додайте слеш в кінці!)
      server.basehref: "/argocd/"
      server.enable.gzip: "false"

  server:
    extraArgs:
      - --insecure

    service:
      type: ClusterIP
      servicePortHttp: 80

    ingress:
      enabled: false

  repoServer:
    replicas: 1
  controller:
    replicas: 1
  redis-ha:
    enabled: false
  redis:
    enabled: true
  notifications:
    enabled: false
