apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-custom
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-redirect-from: "http://my-platform.local/"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "http://my-platform.local/argocd/"
spec:
  ingressClassName: nginx
  rules:
    - host: my-platform.local
      http:
        paths:
          - path: /argocd
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
